[workspace]
resolver = "3"
members = [
  "fml",
]
default-members = ["fml"]

[workspace.package]
version = "0.6.0"
edition = "2024"
description = "Terminal-first log parsing, aggregation, and search for fast debugging."
license = "MIT"

[workspace.dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
async-trait = "0.1.89"
bollard = { version = "0.20", features = ["chrono"] }
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6", features = [
  "cargo",
  "derive",
  "env",
  "string",
  "unicode",
  "wrap_help"
] }
color-eyre = "0.6.5"
config = "0.15"
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
fake = "4.4.0"
frizbee = "0.9"
futures-util = "0.3.32"
glob = "0.3.3"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
kube = { version = "3.1", features = ["runtime"] }
lazy_static = "1.5.0"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
rand = "0.9.2"
ratatui = { version = "0.30", features = ["serde"] }
ratatui-textarea = "0.8.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.100", features = ["full", "parsing"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["full", "tracing"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
toml = "0.8.23"
tower = "0.5.3"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = [
  "chrono",
  "env-filter",
  "serde_json"
] }
tui-popup = "0.7.2"
tui-scrollview = "0.6.2"

base64 = "0.22"
insta = "1"
testcontainers = "0.27.3"

fml-core = { path = "fml-core" }
fml-logs = { path = "fml-logs" }
fml-ui = { path = "fml-ui" }
